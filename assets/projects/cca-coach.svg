  <text x="228" y="725" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.5" fill="#525252">CORE</text>
  <text x="228" y="747" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="15" font-weight="600" fill="#FAFAFA">topics.py</text>
  <text x="228" y="765" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1A1">get_next_topic · weak_spots</text>

  <rect x="367" y="700" width="245" height="76" rx="8" fill="#0F1117" stroke="rgba(255,255,255,0.10)"/>
  <text x="489" y="725" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.5" fill="#525252">CORE</text>
  <text x="489" y="747" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="15" font-weight="600" fill="#FAFAFA">scoring.py</text>
  <text x="489" y="765" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1A1">recency-weighted misses</text>

