  <text x="751" y="725" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.5" fill="#525252">CORE</text>
  <text x="751" y="747" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="15" font-weight="600" fill="#FAFAFA">sessions.py</text>
  <text x="751" y="765" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1A1">log_quiz_attempt · record</text>

  <!-- arrows to DB -->
  <path d="M 228 778 L 228 808 L 490 808" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-dasharray="0"/>
  <path d="M 489 778 L 489 808" fill="none" stroke="#22D3EE" stroke-width="1.2"/>
  <path d="M 751 778 L 751 808 L 490 808" fill="none" stroke="#22D3EE" stroke-width="1.2"/>
  <path d="M 490 808 L 490 818" fill="none" stroke="#22D3EE" stroke-width="1.4" marker-end="url(#arrowhead)"/>

