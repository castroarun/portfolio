  <path d="M 490 380 L 490 432" fill="none" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <path d="M 780 380 L 780 432" fill="none" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arrowhead)"/>

