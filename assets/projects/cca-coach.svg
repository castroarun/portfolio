  <rect x="106" y="510" width="768" height="58" rx="8" fill="#0F1117" stroke="rgba(34,211,238,0.4)" stroke-width="1"/>
  <text x="490" y="535" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="16" font-weight="600" fill="#FAFAFA">Caddy · TLS termination · reverse proxy</text>
  <text x="490" y="555" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1A1">Auto-renew Let's Encrypt  ·  HTTP/2  ·  access log</text>

