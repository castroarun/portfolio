<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1492 940" width="1492" height="940">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#A1A1A1"/>
    </linearGradient>
    <linearGradient id="vps-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(34,211,238,0.06)"/>
      <stop offset="100%" stop-color="rgba(34,211,238,0.0)"/>
    </linearGradient>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowhead-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA"/>
    </marker>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.018)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1492" height="940" fill="url(#bg-grad)"/>
  <rect width="1492" height="940" fill="url(#grid)"/>

  <!-- Title block -->
  <text x="80" y="105" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="3" fill="#22D3EE" font-weight="600">CCA COACH · AGENTIC STUDY SYSTEM</text>
  <text x="80" y="170" font-family="Inter Tight, sans-serif" font-size="62" font-weight="700" letter-spacing="-2" fill="url(#title-grad)">Built with the patterns it teaches.</text>
  <text x="80" y="218" font-family="Inter Tight, sans-serif" font-size="22" fill="#A1A1A1">Hosted MCP server  ·  Sub-agent orchestration  ·  Cross-client SQLite state.</text>

  <!-- Top: Claude clients -->
  <g>
    <rect x="80" y="290" width="240" height="84" rx="10" fill="#161B22" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="200" y="320" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.5" fill="#525252">CLIENT</text>
    <text x="200" y="345" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="17" font-weight="600" fill="#FAFAFA">Claude Desktop</text>
    <text x="200" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1A1">stdio · local</text>

    <rect x="370" y="290" width="240" height="84" rx="10" fill="#161B22" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="490" y="320" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.5" fill="#525252">CLIENT</text>
    <text x="490" y="345" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="17" font-weight="600" fill="#FAFAFA">claude.ai</text>
    <text x="490" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1A1">custom connector · OAuth</text>

    <rect x="660" y="290" width="240" height="84" rx="10" fill="#161B22" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="780" y="320" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.5" fill="#525252">CLIENT</text>
    <text x="780" y="345" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="17" font-weight="600" fill="#FAFAFA">Claude Code</text>
    <text x="780" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1A1">SSE · bearer</text>
  </g>

