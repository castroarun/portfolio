    <text x="1032" y="635" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1A1">scenario MCQs</text>
    <text x="1032" y="652" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1A1">JSON-schema</text>

    <rect x="1109" y="590" width="132" height="80" rx="8" fill="#0F1117" stroke="rgba(167,139,250,0.20)"/>
    <text x="1175" y="616" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">ConceptCoach</text>
    <text x="1175" y="635" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1A1">Socratic mode</text>
    <text x="1175" y="652" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1A1">never gives answer</text>

    <rect x="1252" y="590" width="132" height="80" rx="8" fill="#0F1117" stroke="rgba(167,139,250,0.20)"/>
    <text x="1318" y="616" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">CodeReviewer</text>
    <text x="1318" y="635" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1A1">critiques MCP</text>
    <text x="1318" y="652" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1A1">+ agent prompts</text>

    <text x="966" y="710" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2" fill="#525252">FIVE MCP TOOLS</text>
    <text x="966" y="734" font-family="JetBrains Mono, monospace" font-size="12" fill="#22D3EE">get_next_topic()</text>
    <text x="1175" y="734" font-family="JetBrains Mono, monospace" font-size="12" fill="#525252">get_weak_spots()</text>
    <text x="966" y="754" font-family="JetBrains Mono, monospace" font-size="12" fill="#525252">log_quiz_attempt()</text>
    <text x="1175" y="754" font-family="JetBrains Mono, monospace" font-size="12" fill="#525252">fetch_scenario()</text>
    <text x="966" y="774" font-family="JetBrains Mono, monospace" font-size="12" fill="#525252">record_study_session()</text>

    <text x="966" y="808" font-family="JetBrains Mono, monospace" font-size="11" fill="#525252">Day 1 shipped: get_next_topic · OAuth · TLS · SSE</text>
  </g>

  <!-- DB -->
  <ellipse cx="490" cy="858" rx="118" ry="22" fill="#0F1117" stroke="rgba(34,211,238,0.45)" stroke-width="1.4"/>
  <text x="490" y="853" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">SQLite</text>
  <text x="490" y="870" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#A1A1A1">cca_coach.db · WAL · 5 tables</text>

  <!-- legend / footer -->
  <text x="80" y="912" font-family="JetBrains Mono, monospace" font-size="11" fill="#525252">cca.anycalc.in/mcp  ·  systemd-supervised  ·  pure-Python core  ·  thin MCP adapter  ·  same DB across all clients</text>
</svg>
